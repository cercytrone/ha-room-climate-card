name: Build & Test

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify bundle output
        run: |
          test -s dist/ha-room-climate-card.js
          grep -q "room-climate-card" dist/ha-room-climate-card.js
          printf 'Bundle size: %s\n' "$(wc -c < dist/ha-room-climate-card.js) bytes"

      - name: Check committed bundle is up to date
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date – run 'npm run build' and commit the result."
            git --no-pager diff --stat -- dist/
            exit 1
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: ha-room-climate-card
          path: dist/ha-room-climate-card.js
          if-no-files-found: error
