name: HACS validation

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: HACS repository validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate against HACS requirements
        uses: hacs/action@main
        with:
          category: plugin
